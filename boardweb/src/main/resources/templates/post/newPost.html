<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글 쓰기..</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
</head>
<body>
<!--로그인 상태(우측 상단-->
<div class="container d-flex justify-content-end align-items-center gap-2 py-2">
    <th:block th:if="${loginUser == null}">
        <a th:href="@{/login}" class="btn btn-outline-primary btn-sm">로그인</a>
        <a th:href="@{/signup}" class="btn btn-outline-success btn-sm">회원가입</a>
    </th:block>
    <th:block th:if="${loginUser != null}">
        <span th:text="${loginUser}">아이디님</span>
        <a th:if="${isAdmin}" th:href="@{/admin}" class="btn btn-outline-danger btn-sm">관리자</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-success btn-sm">로그아웃</button>
        </form>
    </th:block>
</div>
<div class="p-5 mb-4 text-center bg-light">
    <h1 class="mb-2">My Board</h1>
</div>

<div class="container" style="width: 60%">
    <h2 class="mb-4" th:text="${post == null} ? '글 쓰기' : '글 수정'">글쓰기</h2>
    <!-- ${post?.id} id가 없으면 null이므로 ?(옵셔닝 기호)-->
    <input type="hidden" id="post-id" th:value="${post?.id}">
    <div class="mb-3">
        <label for="title" class="form-label">제목</label>
        <input type="text" id="title" class="form-control"
               th:value="${post?.title}">
    </div>
    <div class="mb-3">
        <label for="content" class="form-label">글내용</label>
        <textarea id="content" class="form-control"
                  rows="10" th:text="${post?.content}"></textarea>
    </div>
    <button th:if="${post == null}" type="button" id="create-btn"
            class="btn btn-primary">등록</button>
    <button th:if="${post != null}" type="button" id="modify-btn"
            class="btn btn-primary">수정</button>
    <a th:href="@{/posts}" class="btn btn-secondary">취소</a>
</div>

<script th:src="@{/js/post.js}"></script>
</body>
</html>
